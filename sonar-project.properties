# RBT-005 — SonarCloud configuration.
# PIPELINE.md §4.6 + §10. The token (SONAR_TOKEN) is NEVER stored here — it is
# referenced only as ${{ secrets.SONAR_TOKEN }} in CI. Org + project key below match
# the live SonarCloud project (https://sonarcloud.io/project/overview?id=Schitzos_ticketing-testing).
# CI args may still override org/key via SONAR_ORGANIZATION / SONAR_PROJECT_KEY secrets.
sonar.organization=schitzos
sonar.projectKey=Schitzos_ticketing-testing
sonar.projectName=Rusuh Booking Tiket - FE

# Source & test layout (Expo monorepo)
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.expo/**,**/*.d.ts,**/*.config.js,**/*.config.ts
# Coverage exclusions (NOT source exclusions): files that are real code but not unit-coverable.
#  - _layout.tsx: expo-router layout shell (navigation wiring, exercised by e2e not unit).
#  - **/__ac2_tests__/**: the AC2 lint-rule proof (runs via `test:ac2`, Node test runner — it is a
#    test, not product code; Sonar must not count it as coverable new lines).
sonar.coverage.exclusions=**/_layout.tsx,**/__ac2_tests__/**

# Coverage — Jest emits lcov to ./coverage (see jest.config.js coverageReporters).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding / SCM
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
