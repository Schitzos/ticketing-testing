<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Waktu Habis — Rusuh Tiket</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--red:#EC1C24;--ember:#ff5a2d;--ink:#0a0a0c;--muted:rgba(255,255,255,.6);--ease:cubic-bezier(.32,.72,0,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--ink);color:#fff;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font:inherit;cursor:pointer}
  .aura{position:fixed;inset:-30%;z-index:0;filter:blur(80px);opacity:.3;pointer-events:none;background:radial-gradient(34% 40% at 30% 30%,#e8830c 0,transparent 60%),radial-gradient(34% 42% at 72% 70%,#8a1020 0,transparent 62%)}
  .shell{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 20px;text-align:center}
  .glyph{width:84px;height:84px;border-radius:50%;background:rgba(232,131,12,.16);border:1px solid rgba(232,131,12,.4);display:grid;place-items:center;margin-bottom:24px;font-size:38px}
  h1{font-size:25px;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin-top:10px;line-height:1.6;max-width:38ch}
  .card{width:100%;max-width:400px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px 18px;margin-top:24px;font-size:13px;color:var(--muted);line-height:1.6;text-align:left}
  .card b{color:#fff}
  .actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px;margin-top:24px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:11px;border-radius:999px;padding:16px;font-weight:700;font-size:15px;border:none;transition:transform .4s var(--ease)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:#fff;color:var(--ink)}
  .btn.primary .pin{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:14px}
  .btn.ghost{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.15)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aura"></div>
<div class="shell">
  <div class="glyph" id="glyph">⏱️</div>
  <h1 id="title">Waktu pemesananmu habis</h1>
  <p class="sub" id="sub">Batas waktu terlampaui, jadi tiket yang kamu hold otomatis dilepas kembali. Tidak ada biaya yang dikenakan.</p>

  <div class="card" id="card"></div>

  <div class="actions">
    <button class="btn primary" id="requeue">Masuk Antrean Lagi <span class="pin">↗</span></button>
    <button class="btn ghost" onclick="location.href='index.html'">Kembali ke Beranda</button>
  </div>
</div>

<script src="api.js"></script>
<script>
(function(){
  function qs(k){ return new URLSearchParams(location.search).get(k); }
  var reason = qs('reason') || 'booking';
  var bookingId = qs('bookingId');
  var lastEvent = API.storage.get('rb_last_event', null) || (API.storage.get('rb_queue',{})||{}).eventId;

  var copy = {
    booking: {
      glyph:'⏱️',
      title:'Waktu memilih tiket habis',
      sub:'Sesi pemilihan tiket berakhir sebelum kamu menekan Lanjut Bayar. Slot sementara dilepas agar adil untuk pengantre lain.',
      card:'Stok yang tadi kamu pegang sudah dikembalikan ke pool. Kamu perlu <b>masuk antrean lagi</b> untuk mencoba — selama tiket masih tersedia.'
    },
    payment: {
      glyph:'💳',
      title:'Waktu pembayaranmu habis',
      sub:'Batas waktu pembayaran terlampaui, jadi pesanan yang kamu hold otomatis dilepas kembali. Tidak ada biaya yang dikenakan.',
      card:'Kami mengirim notifikasi <b>"pemesanan kedaluwarsa"</b> ke emailmu. Stok sudah dikembalikan ke pool otomatis — kamu bisa mencoba lagi dari antrean selama tiket masih ada.'
    },
    'payment-failed': {
      glyph:'↻',
      title:'Pembayaran belum berhasil',
      sub:'SNAP mengembalikan status gagal. Pesananmu belum dibayar dan masih bisa dicoba lagi selama batas waktunya belum habis.',
      card:'Pilih metode pembayaran lain untuk mencoba kembali. Jika batas waktu booking sudah lewat, stok akan dilepas otomatis.'
    }
  };
  var c = copy[reason] || copy.booking;
  document.title = c.title + ' — Rusuh Tiket';
  document.getElementById('glyph').textContent=c.glyph;
  document.getElementById('title').textContent=c.title;
  document.getElementById('sub').textContent=c.sub;
  document.getElementById('card').innerHTML=c.card;
  if(reason==='payment-failed') document.getElementById('requeue').innerHTML='Coba Metode Lain <span class="pin">↗</span>';

  // Callback navigation is not proof of payment. Re-check the backend before
  // showing a terminal result; a late success must never be shown as failed.
  if(bookingId){
    API.getPaymentStatus(bookingId).then(function(res){
      var d=res.data||{};
      if(d.bookingStatus==='PAID'){
        location.href='success.html?bookingId='+encodeURIComponent(bookingId)+'&orderId='+encodeURIComponent(d.orderId||'');
      } else if(d.bookingStatus==='EXPIRED' && reason==='payment-failed'){
        location.href='expired.html?bookingId='+encodeURIComponent(bookingId)+'&reason=payment';
      }
    }).catch(function(){});
  }

  // notify (fire-and-forget, mirrors Notification service)
  API.notify(reason==='payment'||reason==='payment-failed'?'BOOKING_EXPIRED':'SELECTION_EXPIRED', {});

  document.getElementById('requeue').addEventListener('click', function(){
    if(reason==='payment-failed' && bookingId){
      location.href='payment.html?bookingId='+encodeURIComponent(bookingId);
      return;
    }
    // start over: clear the stale flow state, then back to the event (or home)
    API.resetFlow();
    if(lastEvent) location.href='event.html?eventId='+encodeURIComponent(lastEvent);
    else location.href='index.html';
  });
})();
</script>
</body>
</html>
