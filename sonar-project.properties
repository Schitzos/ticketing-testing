# RBT-005 — SonarCloud configuration.
# PIPELINE.md §4.6 + §10. Organization and project key are supplied by CI env/secrets
# (SONAR_ORGANIZATION / SONAR_PROJECT_KEY) via the scan action's `args`; the token
# (SONAR_TOKEN) is NEVER stored here — it is referenced only as ${{ secrets.SONAR_TOKEN }}.
# Defaults below match TRACKING.md (owner tiket-sampai-nonton / repo rusuh-booking-mobile);
# CI args override them if the SonarCloud project is named differently.
sonar.organization=tiket-sampai-nonton
sonar.projectKey=tiket-sampai-nonton_rusuh-booking-mobile
sonar.projectName=Rusuh Booking Tiket - FE

# Source & test layout (Expo monorepo)
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.expo/**,**/*.d.ts,**/*.config.js,**/*.config.ts

# Coverage — Jest emits lcov to ./coverage (see jest.config.js coverageReporters).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding / SCM
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
